<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>3GPP TS 23.501 RAG Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --border: #262a36;
    --text: #e6e8ee; --muted: #8a90a2; --accent: #5b8def;
    --refuse: #e2b93b; --ok: #4caf7d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  #chat {
    flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px;
    max-width: 780px; margin: 0 auto; width: 100%;
  }
  .msg { padding: 12px 16px; border-radius: 10px; max-width: 90%; line-height: 1.5; font-size: 14px; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--accent); color: white; }
  .bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .bot.refused { border-color: var(--refuse); }
  .sources { margin-top: 10px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 8px; }
  .source-tag { display: inline-block; background: #1e2230; border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; margin: 2px 4px 2px 0; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-bottom: 6px; }
  .badge.verified { background: rgba(76,175,125,0.15); color: var(--ok); }
  .badge.refused { background: rgba(226,185,59,0.15); color: var(--refuse); }
  form { display: flex; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--border); max-width: 780px; margin: 0 auto; width: 100%; }
  input { flex: 1; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 14px; }
  input:focus { outline: 1px solid var(--accent); }
  button { padding: 12px 20px; border-radius: 8px; border: none; background: var(--accent); color: white; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>3GPP TS 23.501 RAG Assistant</h1>
  <p>Grounded Q&amp;A over the 5G System Architecture spec &mdash; refuses to answer when the spec doesn't cover it.</p>
</header>
<div id="chat"></div>
<form id="form">
  <input id="input" placeholder="Ask about registration management, QoS, network slicing..." autocomplete="off" />
  <button id="send" type="submit">Send</button>
</form>
<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  function addMessage(text, role) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addBotResult(data) {
    const div = document.createElement('div');
    div.className = 'msg bot' + (data.refused ? ' refused' : '');
    const badge = document.createElement('div');
    badge.className = 'badge ' + (data.refused ? 'refused' : 'verified');
    badge.textContent = data.refused ? 'No confident answer in corpus' : 'Grounded & verified';
    div.appendChild(badge);
    const body = document.createElement('div');
    body.textContent = data.answer;
    div.appendChild(body);
    if (data.sources && data.sources.length) {
      const src = document.createElement('div');
      src.className = 'sources';
      src.innerHTML = 'Sources: ' + data.sources.map(s =>
        `<span class="source-tag">Clause ${s.clause_id} &middot; ${s.title} (p.${s.pages})</span>`
      ).join('');
      div.appendChild(src);
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    addMessage(message, 'user');
    input.value = '';
    sendBtn.disabled = true;
    const thinking = addMessage('Thinking...', 'bot');
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      });
      const data = await res.json();
      thinking.remove();
      addBotResult(data);
    } catch (err) {
      thinking.textContent = 'Error: could not reach the server.';
    } finally {
      sendBtn.disabled = false;
    }
  });
</script>
</body>
</html>
